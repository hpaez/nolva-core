[package]
name = "uniffi-bindgen"
description = "Pinned UniFFI bindings generator (same version as the core's uniffi dependency)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { workspace = true, features = ["cli"] }
