[package]
name = "pdf-engine"
description = "PDF generation for Nolva: multi-page PDFs from page images."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Password protection (AES-256), pure Rust: RustCrypto and the OS RNG.
aes = "0.9"
getrandom = "0.4"
image = { workspace = true, features = ["jpeg"] }
image-engine.workspace = true
pdf-writer.workspace = true
sha2 = "0.11"
thiserror.workspace = true

[dev-dependencies]
image = { workspace = true, features = ["jpeg", "png"] }
lopdf = "0.47"
tempfile.workspace = true

[lints]
workspace = true
