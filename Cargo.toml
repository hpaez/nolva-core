[workspace]
resolver = "3"
members = [
    "crates/docx-engine",
    "crates/document-engine",
    "crates/image-engine",
    "crates/pdf-engine",
    "crates/scanner-engine",
    "crates/storage-engine",
    "crates/core-ffi",
    "tools/uniffi-bindgen",
]

[workspace.package]
version = "0.16.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
repository = "https://github.com/hpaez/nolva-core"
publish = false

[workspace.dependencies]
docx-engine = { path = "crates/docx-engine" }
document-engine = { path = "crates/document-engine" }
image-engine = { path = "crates/image-engine" }
pdf-engine = { path = "crates/pdf-engine" }
scanner-engine = { path = "crates/scanner-engine" }
storage-engine = { path = "crates/storage-engine" }

# Image crates: codecs are opted into per crate; core types need none.
image = { version = "0.25", default-features = false }
imageproc = { version = "0.27", default-features = false }
pdf-writer = "0.15"
rusqlite = { version = "0.43", features = ["bundled"] }
thiserror = "2"
uniffi = "0.32"
uuid = { version = "1", features = ["v4"] }
# Pure-Rust deflate only: cross-compiles to Android and iOS without C code.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

# Image processing is unbearably slow unoptimized; optimize dependencies
# even in dev/test builds (our own code stays debuggable).
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = "debuginfo"
panic = "unwind"

# Fast optimized build for CI checks: same as release minus the expensive
# whole-program optimizations. Never used for published artifacts.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
