name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # paths-filter lists a PR's changed files through the API.
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          # A file counts as code unless it matches every exclusion below.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'

  rust:
    name: fmt · clippy · test · bindings
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: host
          # PRs read main's cache but don't write their own, keeping the
          # repo under the 10 GB cache limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Reuses the debug artifacts from the steps above.
      - run: cargo build -p core-ffi --locked
      - run: bash scripts/generate-bindings.sh kotlin target/debug/libnolva_core.so build/bindings/kotlin
      - run: bash scripts/generate-bindings.sh swift target/debug/libnolva_core.so build/bindings/swift

  android:
    name: android native build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # macOS minutes are expensive on private repos; iOS is built on release only.
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2
      - name: Build native library (arm64-v8a, ci profile) + Kotlin bindings
        env:
          ANDROID_ABIS: arm64-v8a
          CARGO_PROFILE: ci
        run: bash scripts/build-android.sh
      # Compile the generated Kotlin too: binding issues (e.g. name clashes
      # with Throwable) only show up here, not in the Rust build.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Compile Android library
        run: gradle -p android :nolva-core:assembleRelease

  # The only check required by branch protection. It always runs and fails
  # if any job failed or was cancelled; skipped jobs (docs-only changes)
  # count as success. Required checks then never get stuck waiting for jobs
  # that were skipped, and renaming jobs doesn't touch protection settings.
  result:
    name: CI result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, rust, android]
    if: always()
    steps:
      - name: Check job results
        run: |
          echo '${{ toJSON(needs) }}'
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::A required job failed or was cancelled."
            exit 1
          fi
