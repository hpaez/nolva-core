# Publishes a versioned release of the core:
#   - Android: app.nolva:nolva-core:X.Y.Z (.aar) to GitHub Packages.
#   - iOS (on request): NolvaCoreFFI.xcframework.zip as a GitHub Release
#     asset, plus a release commit (Package.swift pointing at it + Swift
#     bindings) reachable only from tag vX.Y.Z.
#
# When it runs:
#   - Automatically, after CI passes on a push to main, if the version in
#     the root Cargo.toml ([workspace.package] version) has no tag yet.
#     Bumping the version in a PR is the decision to release; merging it is
#     the approval. Other merges leave the version alone and publish nothing.
#   - By hand (Actions → Release → Run workflow), e.g. to build iOS too.
#
# Nothing is validated twice: the automatic run starts only after CI passed
# on that very commit, and main only takes PRs whose CI passed.
#
# Cost: macOS runners bill 10x Linux minutes on private repos, so the iOS
# build only runs when asked by hand (input "ios").
#
# The release commit is NOT pushed to main: main is protected (PRs, signed
# commits, required checks) and doesn't need it. SwiftPM resolves packages by
# tag, so apps pinned to vX.Y.Z get the binary; main keeps an empty binary URL,
# which Package.swift treats as "use a local build".

name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match Cargo.toml, e.g. 0.1.0)"
        required: true
      ios:
        description: "Also build the iOS XCFramework (macOS: 10x the minutes)"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides whether to release, which version and which commit.
  verify:
    # Automatic runs: only for CI that passed on a push to main (never for
    # pull requests, which also run CI).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI validated, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          WANTED: ${{ inputs.version }}
        run: |
          version=$(grep -m1 -E '^version = ' Cargo.toml | cut -d'"' -f2)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Cargo.toml version must be X.Y.Z, got $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          tagged=false
          git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null && tagged=true
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            # By hand: from main only, for the version in Cargo.toml, once.
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::run the release from main"; exit 1; }
            [[ "$WANTED" == "$version" ]] || { echo "::error::Cargo.toml has $version, not $WANTED"; exit 1; }
            [[ "$tagged" == false ]] || { echo "::error::v$version is already released"; exit 1; }
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$tagged" == true ]]; then
            echo "v$version is already released: nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version $version: releasing."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  apple:
    needs: verify
    if: needs.verify.outputs.release == 'true' && inputs.ios
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: v${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: apple
      - name: Build XCFramework
        run: bash scripts/build-ios.sh

      - name: Upload artifact to a draft release
        id: upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --draft --title "$TAG" --notes "Nolva core $VERSION" \
            build/apple/NolvaCoreFFI.xcframework.zip
          asset_id=$(gh api "repos/${{ github.repository }}/releases" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .assets[] | select(.name == \"NolvaCoreFFI.xcframework.zip\") | .id")
          [[ -n "$asset_id" ]] || { echo "::error::asset id not found"; exit 1; }
          # API asset URL (+ .zip so SwiftPM accepts it): works for private
          # repos with a ~/.netrc entry for api.github.com.
          echo "url=https://api.github.com/repos/${{ github.repository }}/releases/assets/${asset_id}.zip" >> "$GITHUB_OUTPUT"

      - name: Create the release commit and tag (tag only, not main)
        run: |
          bash scripts/update-package-swift.sh "${{ steps.upload.outputs.url }}" \
            "$(cat build/apple/NolvaCoreFFI.xcframework.zip.checksum)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Package.swift apple/Sources/NolvaCore/NolvaCore.swift
          git commit -m "release: $TAG"
          git tag -a "$TAG" -m "Nolva core $VERSION"
          git push origin "refs/tags/$TAG"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --verify-tag

  # Without iOS: tag the validated commit and publish a release without
  # assets. SwiftPM consumers need the iOS build; there are none yet.
  tag:
    needs: verify
    if: needs.verify.outputs.release == 'true' && !inputs.ios
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: v${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Nolva core $VERSION"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes "Nolva core $VERSION (Android only: built without iOS)"

  android:
    needs: [verify, apple, tag]
    # Exactly one of apple and tag runs; continue if it succeeded.
    if: ${{ always() && (needs.apple.result == 'success' || needs.tag.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: v${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-release
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2
      - name: Build native libraries + Kotlin bindings
        run: bash scripts/build-android.sh
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
      - name: Publish .aar to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gradle -p android :nolva-core:publish -PcoreVersion="$VERSION"

  # Keeps GitHub Packages under the Free plan's storage after each release.
  prune:
    needs: android
    uses: ./.github/workflows/prune-packages.yml
    permissions:
      contents: read
      packages: write
